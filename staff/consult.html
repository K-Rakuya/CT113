<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư Vấn Trực Tuyến - Nhân Viên</title>
  <link rel="expect" href="#main" blocking="render" />
  <script type="speculationrules">{"prerender":[{"where":{"or":[{"href_matches":"/product-detail.html"},{"href_matches":"/product-detail.html\\?*"},{"href_matches":"/product-list.html"},{"href_matches":"/product-list.html\\?*"}]},"eagerness":"moderate"}],"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/dev/*"}}]},"eagerness":"moderate"}]}</script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-vietnamese-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="modulepreload" href="/js/firebase-config.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" />
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-layout__sidebar">
      <h2>Nhân Viên</h2>
      <nav>
        <a href="/staff/dashboard.html">Tổng quan</a>
        <a href="/staff/orders-manage.html">Quản lý đơn hàng</a>
        <a href="/staff/inventory.html">Kho hàng</a>
        <a href="/staff/support-tickets.html">Hỗ trợ khách hàng</a>
        <a href="/staff/consult.html" class="active">Tư vấn trực tuyến</a>
        <a href="/staff/attendance.html">Điểm danh / Ca làm</a>
      </nav>
    </aside>

    <main id="main" class="dashboard-layout__main">
      <header class="dashboard-layout__topbar">
        <h1>Tư Vấn Trực Tuyến</h1>
        <div>
          <span id="user-info">Đang tải...</span>
          <button id="btn-dang-xuat" class="btn btn--danger btn--sm">Đăng xuất</button>
        </div>
      </header>

      <section class="dashboard-layout__content">
        <div class="card">
          <h3>Khu vực nhắn tin tư vấn</h3>
          <p style="margin-top: 8px; color: var(--color-text-muted, #64748b);">Hệ thống giao tiếp trực tiếp với khách hàng tìm hiểu sản phẩm dịch vụ.</p>

          <div id="consult-list" style="margin-top: 20px;">
            <p>Đang tải danh sách tư vấn...</p>
        </div>
        </div>
        
      </section>
    </main>
  </div>

  <script type="module">
    import { checkRole } from "/js/router-guard.js";
    import { dangXuat } from "/js/auth.js";

    checkRole(["nhan_vien"]);

    document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
      await dangXuat();
      window.location.href = "/login.html";
    });
  </script>
  <script type="module" src="/js/staff/consult.js"></script>
</body>
</html>
