<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tư Vấn và Hỗ Trợ</title>
  <link rel="expect" href="#main" blocking="render" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-vietnamese-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="modulepreload" href="/js/firebase-config.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" />
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body hidden>
  <div class="dashboard-layout">
    <aside class="dashboard-layout__sidebar">
      <h2 id="ten-vai-tro"></h2>
      <nav id="dieu-huong"></nav>
    </aside>

    <main id="main" class="dashboard-layout__main">
      <header class="dashboard-layout__topbar">
        <h1>Tư Vấn và Hỗ Trợ</h1>
        <div>
          <span id="user-info"></span>
          <button id="btn-dang-xuat" class="btn btn--danger btn--sm">Đăng xuất</button>
        </div>
      </header>

      <section class="dashboard-layout__content">
        <div class="card">
          <h3>Phiên tư vấn đang mở</h3>
          <div class="qt-scroll">
            <table class="nv-table">
              <thead><tr><th>Khách hàng</th><th>Trạng thái</th><th>Nhân viên</th><th>Thời gian</th><th>Giao lại</th></tr></thead>
              <tbody id="ds-phien"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <h3>Yêu cầu hỗ trợ chưa xong</h3>
          <div class="qt-scroll">
            <table class="nv-table">
              <thead><tr><th>Tiêu đề</th><th>Trạng thái</th><th>Nhân viên</th><th>Giao lại</th></tr></thead>
              <tbody id="ds-ho-tro"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { khoiTaoTrangQuanTri } from "/js/dashboard-shell.js";
    import { khoiTao } from "/js/owner/support-overview.js";
    khoiTaoTrangQuanTri(["chu_cua_hang"], khoiTao);
  </script>
</body>
</html>
