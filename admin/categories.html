<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản trị — Danh mục sản phẩm</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="site-header">
  <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
  <nav class="site-header__nav">
    <a href="/product-list.html">Sản phẩm</a>
    <a href="/cart.html">Giỏ hàng</a>
    <span data-auth="out"><a href="/login.html">Đăng nhập</a></span>
    <span data-auth="in" hidden>
      <a href="/customer/profile.html">Tài khoản</a>
      <button id="btn-dang-xuat">Đăng xuất</button>
    </span>
  </nav>
</header>

<div class="dashboard-layout">
  <aside class="dashboard-layout__sidebar">
    <nav>
      <a href="/admin/dashboard.html">Tổng quan</a>
      <a href="/admin/users-manage.html">Quản lý người dùng</a>
      <a href="/admin/categories.html"><strong>Danh mục sản phẩm</strong></a>
      <a href="/admin/system-logs.html">Nhật ký hệ thống</a>
      <a href="/admin/settings.html">Cấu hình cửa hàng</a>
    </nav>
  </aside>

  <header class="dashboard-layout__topbar">
    <h1>Danh mục sản phẩm</h1>
  </header>

  <main class="dashboard-layout__content">
    <div class="card">
      <h3 id="formTitle">Thêm danh mục mới</h3>
      <form id="formDanhMuc" class="qt-form">
        <input type="hidden" id="danhMucId">
        <div>
          <label>Tên danh mục</label>
          <input type="text" id="tenDanhMuc" required>
        </div>
        <div class="qt-form-actions">
          <button type="submit" class="btn btn--primary">Lưu</button>
          <button type="button" class="btn btn--secondary" id="btnHuy">Làm mới</button>
        </div>
      </form>
    </div>

    <table class="qt-table" style="margin-top: var(--spacing-lg)">
      <thead><tr><th>Tên danh mục</th><th>Số sản phẩm</th><th>Hành động</th></tr></thead>
      <tbody id="danhMucBody"><tr><td colspan="3" class="qt-empty">Đang tải...</td></tr></tbody>
    </table>
  </main>
</div>

<footer class="site-footer">© 2026 — Đồ án CT113</footer>

<script type="module">
  import { auth } from "/js/firebase-config.js";
  import { dangXuat } from "/js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  onAuthStateChanged(auth, (user) => {
    document.querySelector('[data-auth="in"]').hidden = !user;
    document.querySelector('[data-auth="out"]').hidden = !!user;
  });
  document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
    await dangXuat();
    window.location.href = "/index.html";
  });
</script>

<script type="module">
  import { checkRole } from "/js/router-guard.js";
  checkRole(["quan_tri"]);
</script>

<script type="module" src="/js/admin/categories.js"></script>
</body>
</html>
