<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{localStorage.getItem("ct113.auth")==="in"&&(document.documentElement.dataset.authHint="in")}catch(e){}</script>
  <title>Hỗ trợ kỹ thuật — Website bán linh kiện máy tính</title>
  <link rel="expect" href="#main" blocking="render" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/product.css" />
</head>
<body hidden>

  <header class="site-header">
    <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
    <nav class="site-header__nav">
      <a href="/product-list.html">Sản phẩm</a>
      <a href="/cart.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        Giỏ hàng
      </a>
      <span data-auth="out"><a href="/login.html">Đăng nhập</a></span>
      <span data-auth="in" hidden>
        <a href="/customer/profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
          Tài khoản
        </a>
        <button id="btn-dang-xuat" class="btn btn--secondary">Đăng xuất</button>
      </span>
    </nav>
  </header>

  <main id="main" class="container" style="padding-top: var(--spacing-lg); padding-bottom: var(--spacing-lg);">
    <h1>Tài khoản của tôi</h1>
    <div class="kh-account-layout">
      <nav class="kh-account-layout__nav" aria-label="Tài khoản">
        <a href="/customer/profile.html">Thông tin cá nhân</a>
        <a href="/customer/orders.html">Đơn hàng của tôi</a>
        <a href="/customer/support.html" aria-current="page">Hỗ trợ kỹ thuật</a>
      </nav>
      <div>
        <form id="form-gui-yeu-cau" class="card" style="margin-bottom: var(--spacing-lg);">
          <h3>Gửi yêu cầu mới</h3>
          <div class="form-group">
            <label for="tieu-de">Tiêu đề</label>
            <input class="input" type="text" id="tieu-de" required>
          </div>
          <div class="form-group">
            <label for="noi-dung">Nội dung</label>
            <textarea class="textarea" id="noi-dung" required placeholder="Mô tả vấn đề bạn đang gặp phải..."></textarea>
          </div>
          <button type="submit" class="btn btn--primary" id="btn-gui">Gửi yêu cầu</button>
        </form>

        <h3>Yêu cầu của bạn</h3>
        <div id="danh-sach-yeu-cau">
          <p class="text-muted">Đang tải...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">© 2026 — Đồ án CT113</footer>

  <script type="module">
    import { checkRole } from "/js/router-guard.js";
    import { auth } from "/js/firebase-config.js";
    import { dangXuat } from "/js/auth.js";
    import { initHoTro } from "/js/customer/support.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    checkRole(["khach_hang"], () => {
      document.body.hidden = false;
      initHoTro();
    });

    onAuthStateChanged(auth, (user) => {
      document.querySelector('[data-auth="in"]').hidden = !user;
      document.querySelector('[data-auth="out"]').hidden = !!user;
    });
    document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
      await dangXuat();
      window.location.href = "/index.html";
    });
  </script>
</body>
</html>
