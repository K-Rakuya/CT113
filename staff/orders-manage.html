<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/page-transitions.js"></script>
  <meta name="description" content="Khu vực quản lý nội bộ." />
  <meta name="theme-color" content="#A6541C" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="robots" content="noindex" />
  <title>Quản Lý Đơn Hàng - Nhân Viên</title>
  <link rel="expect" href="#main" blocking="render" />
  <script type="speculationrules">{"prerender":[{"where":{"href_matches":"/staff/*"},"eagerness":"moderate"}],"prefetch":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":"/dev/*"}}]},"eagerness":"moderate"}]}</script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-vietnamese-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="modulepreload" href="/js/firebase-config.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js" />
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
  <div class="dashboard-layout">
    <aside class="dashboard-layout__sidebar">
      <h2>Nhân Viên</h2>
      <nav>
        <a href="/staff/dashboard.html">Tổng quan</a>
        <a href="/staff/orders-manage.html" class="active">Quản lý đơn hàng</a>
        <a href="/staff/inventory.html">Kho hàng</a>
        <a href="/staff/support-tickets.html">Hỗ trợ khách hàng</a>
        <a href="/staff/chat.html">Tư vấn trực tuyến</a>
        <a href="/staff/attendance.html">Điểm danh / Ca làm</a>
      </nav>
    </aside>

    <main id="main" class="dashboard-layout__main">
      <header class="dashboard-layout__topbar">
        <h1>Quản Lý Đơn Hàng</h1>
        <div>
          <span id="user-info">Đang tải...</span>
          <button id="btn-dang-xuat" class="btn btn--danger btn--sm">Đăng xuất</button>
        </div>
      </header>

      <section class="dashboard-layout__content">
        <div class="card">
          <div class="qt-toolbar">
            <div class="qt-tab" id="tab-trang-thai" role="group" aria-label="Lọc theo trạng thái">
              <button type="button" class="qt-chip" data-loc="tat_ca" aria-pressed="true">Tất cả <strong>0</strong></button>
              <button type="button" class="qt-chip" data-loc="cho_duyet" aria-pressed="false">Chờ duyệt <strong>0</strong></button>
              <button type="button" class="qt-chip" data-loc="yeu_cau_huy" aria-pressed="false">Yêu cầu huỷ <strong>0</strong></button>
              <button type="button" class="qt-chip" data-loc="dang_giao" aria-pressed="false">Đang giao <strong>0</strong></button>
              <button type="button" class="qt-chip" data-loc="hoan_thanh" aria-pressed="false">Hoàn thành <strong>0</strong></button>
              <button type="button" class="qt-chip" data-loc="huy" aria-pressed="false">Đã huỷ <strong>0</strong></button>
            </div>
            <input class="input qt-toolbar__grow" type="search" id="tim-kiem-don" placeholder="Tìm theo mã đơn, tên hoặc số điện thoại..." aria-label="Tìm đơn hàng">
          </div>
          <div class="qt-scroll">
            <table class="nv-table">
              <thead>
                <tr>
                  <th>Mã Đơn</th>
                  <th>Khách Hàng</th>
                  <th>Ngày Đặt</th>
                  <th class="qt-num">Tổng Tiền</th>
                  <th>Trạng Thái</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="orders-list">
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { checkRole } from "/js/router-guard.js";
    import { dangXuat } from "/js/auth.js";
    
    checkRole(["nhan_vien"]);

    document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
      await dangXuat();
      window.location.href = "/login.html";
    });
  </script>
  <script type="module" src="/js/staff/orders-manage.js"></script>
</body>
</html>
