<!DOCTYPE html>
<html lang="vi">
<head>

  <script src="/js/page-transitions.js"></script>

</head>
<body hidden>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>

  <header class="site-header">
    <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
    <form class="site-search" action="/product-list.html" method="get" role="search">
      <input class="input" type="search" name="tukhoa" placeholder="Tìm linh kiện..." aria-label="Tìm sản phẩm" autocomplete="off" />
    </form>
    <nav class="site-header__nav" aria-label="Điều hướng chính">
      <a class="site-header__link" href="/product-list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Sản phẩm</span></a>
      <a class="site-header__link" href="/customer/chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-3.6A8 8 0 1 1 20 12Z"/></svg><span>Tư vấn</span></a>
      <a class="site-header__icon" href="/cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>Giỏ hàng</span></a>
      <span data-auth="out"><a class="site-header__cta" href="/login.html">Đăng nhập</a></span>
      <span data-auth="in" hidden>
        <a class="site-header__icon" href="/customer/profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Tài khoản</span></a>
        <button id="btn-dang-xuat" class="btn btn--secondary site-header__logout" type="button" title="Đăng xuất">Đăng xuất</button>
      </span>
    </nav>
  </header>

  <main id="main" class="tk">
    <div class="tk-wrap">
      <div class="tk-head">
        <h1 class="tk-head__title">Hỗ trợ kỹ thuật</h1>
        <p class="tk-head__sub">Gửi yêu cầu và theo dõi phản hồi từ nhân viên.</p>
      </div>
      <div class="tk-layout">
        <aside class="tk-side">
          <div class="tk-user">
            <span class="tk-user__avatar" aria-hidden="true"></span>
            <div class="tk-user__text"><strong class="tk-user__name" id="user-info"></strong><span class="tk-user__role">Khách hàng</span></div>
          </div>
          <nav class="tk-nav" aria-label="Tài khoản"></nav>
        </aside>
        <div class="tk-content">
          <div class="tk-stack">
            <form id="form-gui-yeu-cau" class="card tk-form" novalidate>
              <h2 class="tk-section__title">Gửi yêu cầu mới</h2>
              <div class="form-group">
                <label for="tieu-de">Tiêu đề</label>
                <input class="input" type="text" id="tieu-de" maxlength="120" autocomplete="off" required data-loi="loi-tieu-de" aria-describedby="loi-tieu-de">
                <span class="error-text" id="loi-tieu-de" hidden></span>
              </div>
              <div class="form-group">
                <label for="noi-dung">Nội dung</label>
                <textarea class="textarea" id="noi-dung" rows="5" maxlength="2000" required placeholder="Mô tả vấn đề bạn đang gặp phải..." data-loi="loi-noi-dung" aria-describedby="loi-noi-dung"></textarea>
                <div class="tk-form__meta"><span class="error-text" id="loi-noi-dung" hidden></span><span class="tk-counter" id="dem-noi-dung" aria-hidden="true">0/2000</span></div>
              </div>
              <div class="tk-form__actions">
                <button type="submit" class="btn btn--primary" id="btn-gui">Gửi yêu cầu</button>
              </div>
            </form>

            <section aria-labelledby="h-yeu-cau">
              <h2 class="tk-section__title" id="h-yeu-cau">Yêu cầu của bạn</h2>
              <div id="danh-sach-yeu-cau" aria-busy="true">
                <div aria-hidden="true">
                  <span class="tk-skel tk-skel--ticket skeleton"></span>
                  <span class="tk-skel tk-skel--ticket skeleton"></span>
                </div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script type="module">
    import { checkRole } from "/js/router-guard.js";
    import { initHoTro } from "/js/customer/support.js";

    checkRole(["khach_hang"], () => {
      document.body.hidden = false;
      initHoTro();
    });
  </script>
  <script type="module" src="/js/customer/account-shell.js"></script>
  <script type="module" src="/js/header-ui.js"></script>
  <script type="module" src="/js/site-header.js"></script>
  <script type="module" src="/js/site-footer.js"></script>
  <script type="module" src="/js/store-info.js"></script>
</body>
</html>
