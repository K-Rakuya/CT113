</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>

  <header class="site-header">
    <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
    <form class="site-search" action="/product-list.html" method="get" role="search">
      <input class="input" type="search" name="tukhoa" placeholder="Tìm linh kiện..." aria-label="Tìm sản phẩm" autocomplete="off" />
    </form>
    <nav class="site-header__nav" aria-label="Điều hướng chính">
      <a class="site-header__link" href="/product-list.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Sản phẩm</span></a>
      <a class="site-header__link" href="/customer/chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-3.6A8 8 0 1 1 20 12Z"/></svg><span>Tư vấn</span></a>
      <a class="site-header__icon" href="/cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>Giỏ hàng</span></a>
      <span data-auth="out"><a class="site-header__cta" href="/login.html">Đăng nhập</a></span>
      <span data-auth="in" hidden>
        <a class="site-header__icon" href="/customer/profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Tài khoản</span></a>
        <button id="btn-dang-xuat" class="btn btn--secondary site-header__logout" type="button" title="Đăng xuất">Đăng xuất</button>
      </span>
    </nav>
  </header>

  <main id="main" class="sp">
    <div class="sp-wrap">
      <header class="sp-head">
        <nav class="breadcrumb" aria-label="Breadcrumb" id="sp-breadcrumb">
          <a href="/index.html">Trang chủ</a>
          <span class="breadcrumb__sep">/</span>
          <span aria-current="page">Sản phẩm</span>
        </nav>
        <div class="sp-head__row">
          <div class="sp-head__text">
            <h1 class="sp-head__title" id="sp-tieu-de" tabindex="-1">Sản phẩm</h1>
            <p class="sp-head__count" id="ket-qua-dem" role="status"></p>
          </div>
          <div class="sp-tools">
            <button type="button" class="sp-btn-loc" id="btn-mo-loc" aria-haspopup="dialog" aria-controls="sp-loc">
              <svg class="sp-ic" aria-hidden="true"><use href="/images/home/icons.svg#filter"/></svg>Bộ lọc<span class="sp-btn-loc__so" id="sp-so-loc" hidden></span>
            </button>
            <label class="sp-sort" for="sap-xep">
              <span class="sp-sort__nhan">Sắp xếp</span>
              <select class="sp-sort__chon" id="sap-xep">
                <option value="mac_dinh">Mặc định</option>
                <option value="moi_nhat">Mới nhất</option>
                <option value="gia_tang">Giá thấp đến cao</option>
                <option value="gia_giam">Giá cao đến thấp</option>
                <option value="ten_az">Tên A đến Z</option>
              </select>
            </label>
          </div>
        </div>
      </header>

      <div class="sp-layout">
        <dialog class="sp-filter" id="sp-loc" open aria-labelledby="sp-loc-ten">
          <form id="form-loc" class="sp-filter__form" novalidate>
            <div class="sp-filter__head">
              <h2 id="sp-loc-ten">Bộ lọc</h2>
              <button type="button" class="sp-iconbtn" data-dong aria-label="Đóng bộ lọc"><svg class="sp-ic" aria-hidden="true"><use href="/images/home/icons.svg#close"/></svg></button>
            </div>
            <div class="sp-filter__body">
              <div class="sp-group">
                <label class="sp-group__nhan" for="tu-khoa">Tìm kiếm</label>
                <div class="sp-search">
                  <svg class="sp-ic" aria-hidden="true"><use href="/images/home/icons.svg#search"/></svg>
                  <input class="sp-search__o" type="search" id="tu-khoa" placeholder="Tên sản phẩm" autocomplete="off" enterkeyhint="search" maxlength="100">
                  <kbd class="sp-search__phim" aria-hidden="true">/</kbd>
                </div>
              </div>
              <fieldset class="sp-group">
                <legend class="sp-group__nhan">Danh mục</legend>
                <div class="sp-opts" id="sp-danh-muc" aria-busy="true"><span class="sp-opt-skel skeleton"></span><span class="sp-opt-skel skeleton"></span><span class="sp-opt-skel skeleton"></span><span class="sp-opt-skel skeleton"></span><span class="sp-opt-skel skeleton"></span></div>
              </fieldset>
              <fieldset class="sp-group">
                <legend class="sp-group__nhan">Mức giá</legend>
                <div class="sp-pills" id="sp-muc-gia" hidden></div>
                <div class="sp-range">
                  <label class="sr-only" for="gia-tu">Giá từ</label>
                  <input class="sp-range__o" type="number" id="gia-tu" min="0" step="1000" inputmode="numeric" placeholder="Từ">
                  <span class="sp-range__noi" aria-hidden="true">–</span>
                  <label class="sr-only" for="gia-den">Giá đến</label>
                  <input class="sp-range__o" type="number" id="gia-den" min="0" step="1000" inputmode="numeric" placeholder="Đến">
                  <span class="sp-range__dv" aria-hidden="true">₫</span>
                </div>
              </fieldset>
              <label class="sp-switch">
                <input type="checkbox" id="con-hang" role="switch">
                <span class="sp-switch__ui" aria-hidden="true"></span>
                <span>Chỉ hiện sản phẩm còn hàng</span>
              </label>
            </div>
            <div class="sp-filter__foot">
              <button type="button" class="sp-link" id="btn-xoa-loc">Xoá bộ lọc</button>
              <button type="button" class="btn btn--primary sp-filter__xem" data-dong>Xem kết quả</button>
            </div>
          </form>
        </dialog>

        <section class="sp-results" aria-label="Kết quả">
          <div class="sp-chips" id="sp-chips" hidden></div>
          <div id="danh-sach-san-pham" class="sp-grid" aria-busy="true">
            <div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sp-skel skeleton" aria-hidden="true"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>
          </div>
          <nav id="phan-trang" class="pagination" aria-label="Phân trang"></nav>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/customer/product-list.js"></script>
  <script type="module" src="/js/header-ui.js"></script>
  <script type="module" src="/js/site-header.js"></script>
  <script type="module" src="/js/site-footer.js"></script>
  <script type="module" src="/js/store-info.js"></script>
</body>
</html>
