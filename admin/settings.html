<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị — Cấu hình cửa hàng</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="site-header">
  <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
  <nav class="site-header__nav">
    <a href="/product-list.html">Sản phẩm</a>
    <a href="/cart.html">Giỏ hàng</a>
    <span data-auth="out"><a href="/login.html">Đăng nhập</a></span>
    <span data-auth="in" hidden>
      <a href="/customer/profile.html">Tài khoản</a>
      <button id="btn-dang-xuat-header" class="btn btn--danger btn--sm">Đăng xuất</button>
    </span>
  </nav>
</header>

<div class="dashboard-layout">
  <aside class="dashboard-layout__sidebar">
    <h2>Quản Trị</h2>
    <nav>
      <a href="/admin/dashboard.html">Tổng quan</a>
      <a href="/admin/users-manage.html">Quản lý người dùng</a>
      <a href="/admin/categories.html">Danh mục sản phẩm</a>
      <a href="/admin/system-logs.html">Nhật ký hệ thống</a>
      <a href="/admin/settings.html" class="active"><strong>Cấu hình cửa hàng</strong></a>
    </nav>
  </aside>

  <main class="dashboard-layout__main">
    <header class="dashboard-layout__topbar">
      <h1>Cấu hình cửa hàng</h1>
      <div>
        <span id="user-info">Quản trị viên</span>
        <button id="btn-dang-xuat" class="btn btn--danger btn--sm">Đăng xuất</button>
      </div>
    </header>

    <section class="dashboard-layout__content">
      <div class="card" style="max-width:480px">
        <form id="formCauHinh" class="qt-form">
          <div>
            <label>Logo cửa hàng</label>
            <img id="logoPreview" class="qt-logo-preview" src="" alt="Logo" hidden>
            <input type="file" id="logoFile" accept="image/*">
          </div>
          <div>
            <label>Tên cửa hàng</label>
            <input type="text" id="tenCuaHang" required>
          </div>
          <div>
            <label>Số điện thoại</label>
            <input type="text" id="soDienThoai">
          </div>
          <div>
            <label>Email liên hệ</label>
            <input type="email" id="email">
          </div>
          <div>
            <label>Địa chỉ</label>
            <input type="text" id="diaChi">
          </div>
          <div class="qt-form-actions">
            <button type="submit" class="btn btn--primary">Lưu cấu hình</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</div>

<footer class="site-footer">© 2026 — Đồ án CT113</footer>

<script type="module">
  import { auth } from "/js/firebase-config.js";
  import { dangXuat } from "/js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    document.querySelector('[data-auth="in"]').hidden = !user;
    document.querySelector('[data-auth="out"]').hidden = !!user;
    const elUserInfo = document.getElementById("user-info");
    if (elUserInfo && user) {
      elUserInfo.textContent = user.email || "Quản trị viên";
    }
  });

  const xuLyDangXuat = async () => {
    await dangXuat();
    window.location.href = "/login.html";
  };

  document.querySelectorAll("#btn-dang-xuat, #btn-dang-xuat-header").forEach(btn => {
    btn.addEventListener("click", xuLyDangXuat);
  });
</script>

<script type="module">
  import { checkRole } from "/js/router-guard.js";
  checkRole(["quan_tri"]);
</script>

<script type="module" src="/js/admin/settings.js"></script>
</body>
</html>
