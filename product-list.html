<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Gợi ý trạng thái đăng nhập từ lần trước (xem js/firebase-config.js) -->
  <script>try{localStorage.getItem("ct113.auth")==="in"&&(document.documentElement.dataset.authHint="in")}catch(e){}</script>
  <title>Sản phẩm — Website bán linh kiện máy tính</title>
  <link rel="expect" href="#main" blocking="render" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/product.css" />
</head>
<body>

  <header class="site-header">
    <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
    <nav class="site-header__nav">
      <a href="/product-list.html">Sản phẩm</a>
      <a href="/cart.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        Giỏ hàng
      </a>
      <span data-auth="out"><a href="/login.html">Đăng nhập</a></span>
      <span data-auth="in" hidden>
        <a href="/customer/profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>
          Tài khoản
        </a>
        <button id="btn-dang-xuat" class="btn btn--secondary">Đăng xuất</button>
      </span>
    </nav>
  </header>

  <main id="main" class="container" style="padding-top: var(--spacing-lg); padding-bottom: var(--spacing-lg);">
    <h1>Sản phẩm</h1>

    <div class="kh-catalog-layout">
      <aside class="kh-catalog-layout__filters">
        <h2>Bộ lọc</h2>
        <form id="form-loc">
          <div class="form-group">
            <label for="tu-khoa">Tìm kiếm</label>
            <input class="input" type="search" id="tu-khoa" placeholder="Tên sản phẩm..." />
          </div>
          <div class="form-group">
            <label for="danh-muc">Danh mục</label>
            <select class="select" id="danh-muc">
              <option value="">Tất cả</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gia-tu">Giá từ</label>
            <input class="input" type="number" id="gia-tu" min="0" step="1000" placeholder="0" />
          </div>
          <div class="form-group">
            <label for="gia-den">Giá đến</label>
            <input class="input" type="number" id="gia-den" min="0" step="1000" placeholder="Không giới hạn" />
          </div>
          <button type="submit" class="btn btn--primary">Lọc</button>
        </form>
      </aside>

      <div class="kh-catalog-layout__results">
        <div id="ket-qua-dem" class="text-muted" style="margin-bottom: var(--spacing-md); min-height: 1.55em;"></div> <!-- giữ chỗ 1 dòng: chữ điền vào sau không đẩy lưới xuống -->
        <div id="danh-sach-san-pham" class="grid" aria-busy="true">
          <!-- Khung chờ: hiện ngay khung hình đầu, kích thước khớp thẻ thật (không xô lệch bố cục).
               product-list.js thay bằng thẻ thật và gỡ aria-busy. -->
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
          <div class="card kh-skeleton skeleton" aria-hidden="true"><span class="sk kh-skeleton__img"></span><span class="sk kh-skeleton__line"></span><span class="sk kh-skeleton__line kh-skeleton__line--short"></span><span class="sk kh-skeleton__price"></span><span class="sk kh-skeleton__meta"></span></div>
        </div>
        <div id="phan-trang" class="pagination"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">© 2026 — Đồ án CT113</footer>

  <script type="module">
    import { auth } from "/js/firebase-config.js";
    import { dangXuat } from "/js/auth.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      document.querySelector('[data-auth="in"]').hidden = !user;
      document.querySelector('[data-auth="out"]').hidden = !!user;
    });
    document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
      await dangXuat();
      window.location.href = "/index.html";
    });
  </script>
  <script type="module" src="/js/customer/product-list.js"></script>
</body>
</html>
