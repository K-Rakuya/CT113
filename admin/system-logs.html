<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản trị — Nhật ký hệ thống</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<header class="site-header">
  <a href="/index.html" class="site-header__logo">Tên cửa hàng</a>
  <nav class="site-header__nav">
    <a href="/product-list.html">Sản phẩm</a>
    <a href="/cart.html">Giỏ hàng</a>
    <span data-auth="out"><a href="/login.html">Đăng nhập</a></span>
    <span data-auth="in" hidden>
      <a href="/customer/profile.html">Tài khoản</a>
      <button id="btn-dang-xuat">Đăng xuất</button>
    </span>
  </nav>
</header>

<div class="dashboard-layout">
  <aside class="dashboard-layout__sidebar">
    <nav>
      <a href="/admin/dashboard.html">Tổng quan</a>
      <a href="/admin/users-manage.html">Quản lý người dùng</a>
      <a href="/admin/categories.html">Danh mục sản phẩm</a>
      <a href="/admin/system-logs.html"><strong>Nhật ký hệ thống</strong></a>
      <a href="/admin/settings.html">Cấu hình cửa hàng</a>
    </nav>
  </aside>

  <header class="dashboard-layout__topbar">
    <h1>Nhật ký hệ thống</h1>
  </header>

  <main class="dashboard-layout__content">
    <p style="font-size:13px;color:var(--color-text-muted)">
      Hiển thị 200 nhật ký gần nhất. Bộ lọc bên dưới áp dụng trên tập dữ liệu đã tải.
    </p>

    <div class="qt-filter-bar">
      <input type="date" id="filterNgay" title="Lọc theo ngày">
      <select id="filterHanhDong">
        <option value="">-- Tất cả hành động --</option>
      </select>
      <select id="filterNguoiThucHien">
        <option value="">-- Tất cả người thực hiện --</option>
      </select>
      <button type="button" class="qt-btn-sm" id="btnXoaLoc">Xoá bộ lọc</button>
    </div>

    <table class="qt-table">
      <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th></tr></thead>
      <tbody id="logBody"><tr><td colspan="3" class="qt-empty">Đang tải...</td></tr></tbody>
    </table>
  </main>
</div>

<footer class="site-footer">© 2026 — Đồ án CT113</footer>

<script type="module">
  import { auth } from "/js/firebase-config.js";
  import { dangXuat } from "/js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  onAuthStateChanged(auth, (user) => {
    document.querySelector('[data-auth="in"]').hidden = !user;
    document.querySelector('[data-auth="out"]').hidden = !!user;
  });
  document.getElementById("btn-dang-xuat")?.addEventListener("click", async () => {
    await dangXuat();
    window.location.href = "/index.html";
  });
</script>

<script type="module">
  import { checkRole } from "/js/router-guard.js";
  checkRole(["quan_tri"]);
</script>

<script type="module" src="/js/admin/system-logs.js"></script>
</body>
</html>
